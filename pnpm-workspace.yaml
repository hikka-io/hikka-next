packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  mdast-util-to-markdown: 2.1.2
  'react-tracked>react-native': '-'
  'use-context-selector>react-native': '-'

allowBuilds:
  '@swc/core': true
  esbuild: true

# Hoist the @takumi-rs native packages (OG image generation) to the root
# node_modules so the whole closure lives in one place. The Dockerfile
# dereference-copies it into the runtime image (Nitro externalizes these
# native bindings rather than bundling them).
publicHoistPattern:
  - '@takumi-rs/*'
